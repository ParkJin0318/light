# Mac 앱 빌드 — release 브랜치에 푸시하면(또는 손으로 돌리면) scripts/build-mac.sh 로 dmg 를 만들어 아티팩트로 올린다.
# release 브랜치면 mac/package.json 의 version 으로 v 태그와 GitHub 릴리스도 낸다. 같은 버전의 릴리스가 있으면 건너뛴다.
# release 브랜치 빌드만 번들에 이 레포를 싣고(LIGHT_RELEASE_REPO) 릴리스에 zip 과 업데이트 명세(light-update.json)를 함께 올린다.
# 설치본은 최신 릴리스의 명세를 읽어 새 버전을 받아 두었다가 끌 때 갈아 끼운다(mac/src/update.ts).
# 서명·공증은 저장소 시크릿이 있을 때만 한다. 없으면 서명하지 않은 빌드다.
#   MAC_CERTIFICATE           Developer ID Application 인증서 .p12 의 base64
#   MAC_CERTIFICATE_PASSWORD  그 .p12 의 암호
#   MAC_CERTIFICATE_NAME      인증서 이름(CSC_NAME)
#   APPLE_ID · APPLE_APP_SPECIFIC_PASSWORD · APPLE_TEAM_ID  공증
# 러너가 Apple Silicon 이라 arm64 빌드만 나온다(데몬 실행 파일이 러너 아키텍처를 따른다).
name: Mac app

on:
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

# 릴리스와 태그를 만든다
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      # 쓰기 토큰이 .git/config 에 남지 않게 한다 — 토큰은 Release 단계에만 넘긴다
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          MAC_CERTIFICATE_NAME: ${{ secrets.MAC_CERTIFICATE_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # 다른 브랜치 빌드는 이 기기에서 지은 빌드처럼 업데이트를 받지 않는다
          LIGHT_RELEASE_REPO: ${{ github.ref == 'refs/heads/release' && github.repository || '' }}
        # electron-builder 는 빈 CSC_LINK 도 인증서로 읽으려 들어서 시크릿이 있을 때만 넘긴다
        run: |
          if [ -n "$MAC_CERTIFICATE" ]; then
            export CSC_LINK="$MAC_CERTIFICATE" CSC_KEY_PASSWORD="$MAC_CERTIFICATE_PASSWORD" CSC_NAME="$MAC_CERTIFICATE_NAME"
          fi
          sh scripts/build-mac.sh

      - uses: actions/upload-artifact@v7
        with:
          name: light-mac-${{ github.sha }}
          path: mac/release/*.dmg
          if-no-files-found: error

      # 이미 낸 버전은 덮지 않는다 — 새 릴리스는 mac/package.json 의 version 을 올려서 낸다
      - name: Release
        if: github.ref == 'refs/heads/release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$(node -p "require('./mac/package.json').version")"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::warning::$tag 릴리스가 이미 있어 새로 내지 않았습니다. mac/package.json 의 version 을 올려 다시 푸시합니다"
            exit 0
          fi
          set -- --title "light $tag" --target "$GITHUB_SHA" --generate-notes
          # 공증 표가 붙지 않은 앱은 Gatekeeper 가 막는다 — 여는 법을 자동 노트 앞에 둔다
          if ! xcrun stapler validate mac/release/mac*/light.app >/dev/null 2>&1; then
            printf '%s\n' \
              'This build is not signed with a Developer ID or notarized, so macOS refuses to open it at first. Drag light to Applications, then run this once:' \
              '' \
              '```sh' \
              'xattr -dr com.apple.quarantine /Applications/light.app' \
              '```' \
              > "$RUNNER_TEMP/notes.md"
            set -- "$@" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release create "$tag" mac/release/*.dmg mac/release/*.zip mac/release/light-update.json "$@"
